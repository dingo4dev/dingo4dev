# .github/workflows/update-activity.yml:

name: Update GitHub Activity

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch: # Allows manual triggering

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GitHub Activity
        uses: TheDanniCraft/activity-log@v1
        with:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Ensure this matches the secret name in repository settings
          IGNORE_EVENTS: '["PullRequestEvent.closed","PullRequestEvent.reopened","PullRequestEvent.assigned"]'
          HIDE_DETAILS_ON_PRIVATE_REPOS: true
          EVENT_EMOJI_MAP: |
            PushEvent: "🚀"
            CreateEvent: "✨"
            DeleteEvent: "🔥"
            IssuesEvent: |
              opened: "🆕"
              closed: "✅"
          
